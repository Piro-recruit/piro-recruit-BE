# application.yml

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
      hibernate:
        format_sql: true
    data:
      jpa:
        repositories:
          enabled: true # JPA Repository

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha # 태그를 알파벳 순으로 정렬
      operations-sorter: alpha # API 메서드를 알파벳 순으로 정렬
    api-docs:
      path: /api-docs # API 문서 JSON 경로 설정

# AWS SES 설정
aws:
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:ap-northeast-2}
  ses:
    from-email: ${SES_FROM_EMAIL:violet2111@naver.com}
    max-send-rate: ${AWS_SES_MAX_SEND_RATE:14}
    batch-size: ${AWS_SES_BATCH_SIZE:50}
    retry-count: ${AWS_SES_RETRY_COUNT:3}

mail:
  test:
    admin-email: ${ADMIN_TEST_EMAIL:rlarbdlf222@naver.com}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.ayu.realty: debug
    org.springframework.security: debug

jwt:
  secret: ${JWT_SECRET}

admin:
  root:
    login-code: ${ROOT_ADMIN_LOGIN_CODE}

openai:
  api:
    key: ${OPENAI_API_KEY}

webhook:
  api:
    key: ${WEBHOOK_API_KEY}

# 리크루팅 관련 설정
recruitment:
  current-level: 25  # 현재 리크루팅 기수 (25기)

# AI 배치 처리 설정
ai:
  batch:
    processing:
      enabled: true        # 배치 처리 활성화 여부
      interval: 5          # 배치 처리 주기 (초)
      size: 8              # 한 번에 처리할 작업 수 (OpenAI Semaphore 10개 고려)
      retry:
        delay: 300         # 실패 작업 재시도 대기 시간 (초)
        max-attempts: 3    # 최대 재시도 횟수